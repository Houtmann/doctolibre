<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRF}}">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
  <title>{{block "title" .}}Accueil{{end}} · Doctolibre</title>
  <link rel="stylesheet" href="{{asset "ui.css"}}">

  <script src="{{asset "htmx.min.js"}}" defer></script>
</head>
<body class="bg-base-200 text-base-content min-h-screen" hx-headers="{{.HXHeaders}}">
  <a class="sr-only focus:not-sr-only btn btn-primary btn-sm absolute z-50 m-2" href="#main">Aller au contenu</a>
  {{template "chrome" .}}
</body>
</html>

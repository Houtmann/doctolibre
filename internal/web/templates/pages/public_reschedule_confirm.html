{{define "title"}}Confirmer le déplacement{{end}}
{{define "content"}}
<nav aria-label="Fil d'Ariane"><a class="link link-primary" href="{{.Data.BackURL}}">&larr; Changer de créneau</a></nav>
<h1 class="text-2xl font-semibold">Confirmer le déplacement</h1>
<p>Rendez-vous actuel : <time datetime="{{.Data.Previous.Format "2006-01-02T15:04:05Z07:00"}}">{{localDate .Data.Previous}} à {{localTime .Data.Previous}}</time></p>
<p>Nouveau rendez-vous :</p>
{{template "booking_summary.html" .Data.Summary}}
<form method="post" action="{{.Data.Action}}">
  {{csrf .CSRF}}
  <input type="hidden" name="start" value="{{.Data.Start}}">
  <button class="btn btn-primary w-full sm:w-auto" type="submit">Confirmer le déplacement</button>
</form>
{{end}}

{{define "title"}}Connexion{{end}}
{{define "content"}}
<section class="mx-auto w-full max-w-md space-y-4">
  <h1 class="text-2xl font-semibold">Connexion</h1>
  {{template "form_errors.html" .Data.Errors}}
  <form class="space-y-4" method="post" action="/admin/login">
    {{csrf .CSRF}}
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="space-y-1">
      <label class="block text-sm font-medium" for="email">Adresse email</label>
      <input class="input w-full{{if .Data.Failed}} input-error{{end}}" id="email" name="email" type="email" value="{{.Data.Email}}" autocomplete="username" required{{if .Data.Failed}} aria-invalid="true" aria-describedby="form-errors"{{end}}>
    </div>
    <div class="space-y-1">
      <label class="block text-sm font-medium" for="password">Mot de passe</label>
      <input class="input w-full{{if .Data.Failed}} input-error{{end}}" id="password" name="password" type="password" autocomplete="current-password" required{{if .Data.Failed}} aria-invalid="true" aria-describedby="form-errors"{{end}}>
    </div>
    <button class="btn btn-primary w-full" type="submit">Se connecter</button>
  </form>
  <p><a class="link link-primary" href="/admin/password/forgot">Mot de passe oublié ?</a></p>
</section>
{{end}}

{{/* layout: admin */}}
{{define "title"}}Horaires d'ouverture{{end}}
{{define "content"}}
<h1>Horaires d'ouverture</h1>
{{with .Data.Switch}}
<form method="get" action="{{.Action}}" class="dl-cluster" role="search">
  <label for="practitioner-select">Praticien</label>
  <select id="practitioner-select" name="practitioner">
    {{range .Options}}<option value="{{.ID}}"{{if .Selected}} selected{{end}}>{{.Name}}</option>{{end}}
  </select>
  <button class="dl-btn dl-btn--outline" type="submit">Afficher</button>
</form>
{{end}}
{{template "availability_panel.html" .Data}}
{{end}}

{{define "title"}}Mot de passe oublié{{end}}
{{define "content"}}
<section class="login">
  <h1>Mot de passe oublié</h1>
  <p>Saisissez votre adresse email : si un compte existe, vous recevrez un lien valable 1 heure pour choisir un nouveau mot de passe.</p>
  <form method="post" action="/admin/password/forgot">
    {{csrf .CSRF}}
    <label for="email">Adresse email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <button class="dl-btn" type="submit">Envoyer le lien</button>
  </form>
  <p><a href="/admin/login">Retour à la connexion</a></p>
</section>
{{end}}

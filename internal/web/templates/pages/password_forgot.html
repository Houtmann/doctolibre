{{define "title"}}Mot de passe oublié{{end}}
{{define "content"}}
<section class="mx-auto w-full max-w-md space-y-4">
  <h1 class="text-2xl font-semibold">Mot de passe oublié</h1>
  <p>Saisissez votre adresse email : si un compte existe, vous recevrez un lien valable 1 heure pour choisir un nouveau mot de passe.</p>
  <form class="space-y-4" method="post" action="/admin/password/forgot">
    {{csrf .CSRF}}
    <div class="space-y-1">
      <label class="block text-sm font-medium" for="email">Adresse email</label>
      <input class="input w-full" id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <button class="btn btn-primary w-full" type="submit">Envoyer le lien</button>
  </form>
  <p><a class="link link-primary" href="/admin/login">Retour à la connexion</a></p>
</section>
{{end}}

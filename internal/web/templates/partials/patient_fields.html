<div class="grid">
  <div>
    <label for="pf-last-name">Nom</label>
    <input id="pf-last-name" name="last_name" value="{{.LastName}}" maxlength="80" required autocomplete="off">
  </div>
  <div>
    <label for="pf-first-name">Prénom</label>
    <input id="pf-first-name" name="first_name" value="{{.FirstName}}" maxlength="80" required autocomplete="off">
  </div>
</div>
<div class="grid">
  <div>
    <label for="pf-phone">Téléphone</label>
    <input id="pf-phone" name="phone" type="tel" value="{{.Phone}}" autocomplete="off">
  </div>
  <div>
    <label for="pf-email">Email</label>
    <input id="pf-email" name="email" type="email" value="{{.Email}}" autocomplete="off">
  </div>
</div>
<small>Un téléphone ou un email est requis.</small>
<label for="pf-birth">Date de naissance (facultative)</label>
<input id="pf-birth" name="birth_date" type="date" value="{{.BirthDate}}">
<fieldset>
  <legend>Notifications</legend>
  <label for="pf-sms"><input id="pf-sms" type="checkbox" name="sms_opt_in" value="1"{{if eq .SMSOptIn "1"}} checked{{end}}> Accepte les SMS</label>
  <label for="pf-mail"><input id="pf-mail" type="checkbox" name="email_opt_in" value="1"{{if eq .EmailOptIn "1"}} checked{{end}}> Accepte les emails</label>
</fieldset>
<label for="pf-notes">Note administrative</label>
<textarea id="pf-notes" name="notes_admin" rows="3" maxlength="500">{{.Notes}}</textarea>
<small>Pas de données médicales : cette note est réservée à l'organisation du cabinet (500 caractères maximum).</small>

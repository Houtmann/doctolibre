<form method="post" action="/admin/appointments/{{.D.ID}}/status" hx-post="/admin/appointments/{{.D.ID}}/status" hx-target="#appt-detail" hx-swap="outerHTML">
  {{csrf .CSRF}}
  <input type="hidden" name="status" value="{{.Status}}">
  <input type="hidden" name="date" value="{{.D.MoveDate}}">
  <input type="hidden" name="view" value="{{.View}}">
  <button class="dl-btn dl-btn--secondary" type="submit">{{.Label}}</button>
</form>

<div id="patient-results" aria-live="polite">
  {{if .Patients}}
  <ul class="patient-results">
    {{range .Patients}}
    <li>
      <label><input type="radio" name="patient_id" value="{{.ID}}" form="appt-create"{{if .Selected}} checked{{end}}> {{.Name}}{{if .Contact}} <small>({{.Contact}})</small>{{end}}</label>
    </li>
    {{end}}
  </ul>
  {{else if .Form.Query}}<p><small>Aucun patient trouvé. Créez-le ci-dessous.</small></p>{{end}}
</div>

name: doctolibre

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctolibre-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCTOLIBRE_ENV: dev
      DOCTOLIBRE_HTTP_ADDR: ":8080"
      DOCTOLIBRE_BASE_URL: http://localhost:8080
      DOCTOLIBRE_DATABASE_URL: postgres://doctolibre:doctolibre@postgres:5432/doctolibre?sslmode=disable
      DOCTOLIBRE_SECRET_KEY: doctolibre-local-development-secret-key-32-chars
      DOCTOLIBRE_TIMEZONE: Europe/Paris
      DOCTOLIBRE_AUTO_MIGRATE: "true"
    healthcheck:
      test: ["CMD", "/doctolibre", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: doctolibre-postgres
    environment:
      POSTGRES_USER: doctolibre
      POSTGRES_PASSWORD: doctolibre
      POSTGRES_DB: doctolibre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctolibre -d doctolibre"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: doctolibre-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:

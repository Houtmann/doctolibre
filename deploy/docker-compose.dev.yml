services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doctolibre
      POSTGRES_PASSWORD: doctolibre
      POSTGRES_DB: doctolibre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctolibre"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Faux serveur SMTP de dev : DOCTOLIBRE_EMAIL_DRIVER=smtp DOCTOLIBRE_SMTP_HOST=localhost
  # DOCTOLIBRE_SMTP_PORT=1025 DOCTOLIBRE_SMTP_TLS=none DOCTOLIBRE_SMTP_FROM=rdv@localhost ;
  # interface web des messages reçus sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:

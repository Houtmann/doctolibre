services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doctolibre
      POSTGRES_PASSWORD: doctolibre
      POSTGRES_DB: doctolibre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctolibre"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

# Production : cd deploy && cp .env.example .env && (éditer .env) && docker compose up -d
# Le fichier .env de ce dossier est lu automatiquement par docker compose.
name: doctolibre

services:
  app:
    # Image publiée sur GHCR par la release ; pour construire localement :
    #   docker compose up -d --build
    image: ${DOCTOLIBRE_IMAGE:-ghcr.io/houtmann/doctolibre:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCTOLIBRE_ENV: prod
      DOCTOLIBRE_HTTP_ADDR: ":8080"
      DOCTOLIBRE_BASE_URL: https://${DOMAIN:?DOMAIN est obligatoire (voir .env.example)}
      DOCTOLIBRE_DATABASE_URL: postgres://doctolibre:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@postgres:5432/doctolibre?sslmode=disable
      DOCTOLIBRE_SECRET_KEY: ${DOCTOLIBRE_SECRET_KEY:?DOCTOLIBRE_SECRET_KEY est obligatoire (openssl rand -hex 32)}
      DOCTOLIBRE_TIMEZONE: ${DOCTOLIBRE_TIMEZONE:-Europe/Paris}
      DOCTOLIBRE_AUTO_MIGRATE: ${DOCTOLIBRE_AUTO_MIGRATE:-true}
      DOCTOLIBRE_METRICS_TOKEN: ${DOCTOLIBRE_METRICS_TOKEN:-}
      DOCTOLIBRE_BACKUP_DIR: ${DOCTOLIBRE_BACKUP_DIR:-}
      DOCTOLIBRE_WORKER: ${DOCTOLIBRE_WORKER:-on}
      DOCTOLIBRE_EMAIL_DRIVER: ${DOCTOLIBRE_EMAIL_DRIVER:-smtp}
      DOCTOLIBRE_SMTP_HOST: ${DOCTOLIBRE_SMTP_HOST:-}
      DOCTOLIBRE_SMTP_PORT: ${DOCTOLIBRE_SMTP_PORT:-}
      DOCTOLIBRE_SMTP_USER: ${DOCTOLIBRE_SMTP_USER:-}
      DOCTOLIBRE_SMTP_PASSWORD: ${DOCTOLIBRE_SMTP_PASSWORD:-}
      DOCTOLIBRE_SMTP_FROM: ${DOCTOLIBRE_SMTP_FROM:-}
      DOCTOLIBRE_SMTP_TLS: ${DOCTOLIBRE_SMTP_TLS:-starttls}
      DOCTOLIBRE_NOTIFY_ALLOW_PRIVATE_HOSTS: ${DOCTOLIBRE_NOTIFY_ALLOW_PRIVATE_HOSTS:-false}
      DOCTOLIBRE_SMS_DRIVER: ${DOCTOLIBRE_SMS_DRIVER:-log}
      DOCTOLIBRE_SMS_SENDER: ${DOCTOLIBRE_SMS_SENDER:-}
      DOCTOLIBRE_SMS_TRANSLITERATE: ${DOCTOLIBRE_SMS_TRANSLITERATE:-true}
      DOCTOLIBRE_SMS_OVH_SERVICE: ${DOCTOLIBRE_SMS_OVH_SERVICE:-}
      DOCTOLIBRE_SMS_OVH_APP_KEY: ${DOCTOLIBRE_SMS_OVH_APP_KEY:-}
      DOCTOLIBRE_SMS_OVH_APP_SECRET: ${DOCTOLIBRE_SMS_OVH_APP_SECRET:-}
      DOCTOLIBRE_SMS_OVH_CONSUMER_KEY: ${DOCTOLIBRE_SMS_OVH_CONSUMER_KEY:-}
      DOCTOLIBRE_SMS_OVH_ENDPOINT: ${DOCTOLIBRE_SMS_OVH_ENDPOINT:-}
      DOCTOLIBRE_SMS_ANDROID_URL: ${DOCTOLIBRE_SMS_ANDROID_URL:-}
      DOCTOLIBRE_SMS_ANDROID_USER: ${DOCTOLIBRE_SMS_ANDROID_USER:-}
      DOCTOLIBRE_SMS_ANDROID_PASSWORD: ${DOCTOLIBRE_SMS_ANDROID_PASSWORD:-}
      DOCTOLIBRE_SMS_HTTP_URL: ${DOCTOLIBRE_SMS_HTTP_URL:-}
      DOCTOLIBRE_SMS_HTTP_METHOD: ${DOCTOLIBRE_SMS_HTTP_METHOD:-POST}
      DOCTOLIBRE_SMS_HTTP_HEADERS: ${DOCTOLIBRE_SMS_HTTP_HEADERS:-}
      DOCTOLIBRE_SMS_HTTP_BODY: ${DOCTOLIBRE_SMS_HTTP_BODY:-}
      DOCTOLIBRE_SMS_HTTP_BASIC_USER: ${DOCTOLIBRE_SMS_HTTP_BASIC_USER:-}
      DOCTOLIBRE_SMS_HTTP_BASIC_PASSWORD: ${DOCTOLIBRE_SMS_HTTP_BASIC_PASSWORD:-}
      DOCTOLIBRE_SMS_HTTP_BEARER: ${DOCTOLIBRE_SMS_HTTP_BEARER:-}
      # Caddy est le seul pair fiable : son X-Forwarded-For donne l'IP du client.
      DOCTOLIBRE_TRUSTED_PROXIES: 172.30.0.0/24
    volumes:
      # Marqueur de dernière sauvegarde réussie, en lecture seule (voir DOCTOLIBRE_BACKUP_DIR).
      - backups:/backups:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/doctolibre", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: doctolibre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: doctolibre
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctolibre -d doctolibre"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # Sauvegardes chiffrées (age) quotidiennes : voir docs/backup.md. Activé par COMPOSE_PROFILES=backup (.env).
  backup:
    profiles: ["backup"]
    build:
      context: ./backup
    image: doctolibre-backup:local
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_DATABASE_URL: postgres://doctolibre:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@postgres:5432/doctolibre?sslmode=disable
      DOCTOLIBRE_BACKUP_AGE_RECIPIENT: ${DOCTOLIBRE_BACKUP_AGE_RECIPIENT:-}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      DOCTOLIBRE_BACKUP_S3_ENDPOINT: ${DOCTOLIBRE_BACKUP_S3_ENDPOINT:-}
      DOCTOLIBRE_BACKUP_S3_BUCKET: ${DOCTOLIBRE_BACKUP_S3_BUCKET:-}
      DOCTOLIBRE_BACKUP_S3_ACCESS_KEY: ${DOCTOLIBRE_BACKUP_S3_ACCESS_KEY:-}
      DOCTOLIBRE_BACKUP_S3_SECRET_KEY: ${DOCTOLIBRE_BACKUP_S3_SECRET_KEY:-}
      DOCTOLIBRE_BACKUP_S3_REGION: ${DOCTOLIBRE_BACKUP_S3_REGION:-}
      DOCTOLIBRE_BACKUP_S3_PREFIX: ${DOCTOLIBRE_BACKUP_S3_PREFIX:-doctolibre}
    volumes:
      - backups:/backups
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN est obligatoire}
      # Email ACME de l'exploitant (Let's Encrypt) ou "internal" (test local).
      CADDY_TLS: ${CADDY_TLS:?CADDY_TLS requis (email ACME ou internal)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:

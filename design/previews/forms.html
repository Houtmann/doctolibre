<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champs de formulaire</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../grid.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="pv"><section class="pv-panel" data-theme="light"><p class="pv-tag">Clair</p>
<div class="dl-field"><label class="dl-label" for="n">Nom</label><input class="dl-input" id="n" value="Durand"></div>
<div class="dl-field is-invalid"><label class="dl-label" for="p">Téléphone</label><input class="dl-input" id="p" value="06 12" aria-invalid="true" aria-describedby="ph"><p class="dl-help" id="ph">Numéro incomplet.</p></div>
<div class="dl-field"><label class="dl-label" for="t">Motif</label><select class="dl-select" id="t"><option>Séance de rééducation — 30 min</option></select></div>
<div class="dl-field"><label class="dl-label" for="note">Note administrative <span class="dl-optional">(facultatif)</span></label><textarea class="dl-textarea" id="note"></textarea><p class="dl-note-warning">Aucune donnée médicale dans ce champ.</p></div>
<label class="dl-check"><input type="checkbox" checked> Recevoir le rappel par SMS la veille</label>
</section><section class="pv-panel" data-theme="dark"><p class="pv-tag">Sombre</p>
<div class="dl-field"><label class="dl-label" for="n">Nom</label><input class="dl-input" id="n" value="Durand"></div>
<div class="dl-field is-invalid"><label class="dl-label" for="p">Téléphone</label><input class="dl-input" id="p" value="06 12" aria-invalid="true" aria-describedby="ph"><p class="dl-help" id="ph">Numéro incomplet.</p></div>
<div class="dl-field"><label class="dl-label" for="t">Motif</label><select class="dl-select" id="t"><option>Séance de rééducation — 30 min</option></select></div>
<div class="dl-field"><label class="dl-label" for="note">Note administrative <span class="dl-optional">(facultatif)</span></label><textarea class="dl-textarea" id="note"></textarea><p class="dl-note-warning">Aucune donnée médicale dans ce champ.</p></div>
<label class="dl-check"><input type="checkbox" checked> Recevoir le rappel par SMS la veille</label>
</section></div>
</body>
</html>

<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialogue — détail d'un RDV</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../grid.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="pv"><section class="pv-panel" data-theme="light"><p class="pv-tag">Clair</p>
<div class="dl-dialog" role="dialog" aria-labelledby="dt" style="display:block;position:static;margin:0 auto">
  <div class="dl-dialog__header"><h2 id="dt">Rendez-vous</h2><button class="dl-btn dl-btn--ghost dl-btn--sm" aria-label="Fermer">✕</button></div>
  <div class="dl-dialog__body">
    <dl class="dl-details"><dt>Patient</dt><dd>Marc Durand</dd><dt>Horaire</dt><dd class="dl-num">Jeu. 16 oct., 09:30 – 10:15</dd><dt>Motif</dt><dd>Bilan initial</dd><dt>État</dt><dd><span class="dl-badge dl-badge--st-booked">Réservé</span></dd></dl>
  </div>
  <div class="dl-dialog__footer"><button class="dl-btn dl-btn--secondary dl-btn--sm">Marquer honoré</button><button class="dl-btn dl-btn--outline dl-btn--sm">Absent</button><button class="dl-btn dl-btn--danger dl-btn--sm">Annuler</button></div>
</div>
</section><section class="pv-panel" data-theme="dark"><p class="pv-tag">Sombre</p>
<div class="dl-dialog" role="dialog" aria-labelledby="dt" style="display:block;position:static;margin:0 auto">
  <div class="dl-dialog__header"><h2 id="dt">Rendez-vous</h2><button class="dl-btn dl-btn--ghost dl-btn--sm" aria-label="Fermer">✕</button></div>
  <div class="dl-dialog__body">
    <dl class="dl-details"><dt>Patient</dt><dd>Marc Durand</dd><dt>Horaire</dt><dd class="dl-num">Jeu. 16 oct., 09:30 – 10:15</dd><dt>Motif</dt><dd>Bilan initial</dd><dt>État</dt><dd><span class="dl-badge dl-badge--st-booked">Réservé</span></dd></dl>
  </div>
  <div class="dl-dialog__footer"><button class="dl-btn dl-btn--secondary dl-btn--sm">Marquer honoré</button><button class="dl-btn dl-btn--outline dl-btn--sm">Absent</button><button class="dl-btn dl-btn--danger dl-btn--sm">Annuler</button></div>
</div>
</section></div>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: doctolibre
          POSTGRES_PASSWORD: doctolibre
          POSTGRES_DB: doctolibre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doctolibre"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCTOLIBRE_TEST_DATABASE_URL: postgres://doctolibre:doctolibre@localhost:5432/doctolibre_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Outillage front (Tailwind, sha256 vérifié)
        run: make tools
      - name: ui.css à jour
        run: make css-check
      - run: make check

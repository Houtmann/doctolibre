<!doctype html>
<html lang="fr" data-theme="doctolibre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda — Cabinet des Lilas</title>
<link rel="stylesheet" href="vendor/event-calendar.min.css">
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<script src="vendor/event-calendar.min.js" defer></script>
<script src="agenda.js" defer></script>
</head>
<body class="bg-base-200 text-base-content">
<div class="drawer lg:drawer-open">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle" aria-label="Ouvrir le menu">
  <div class="drawer-content flex flex-col min-h-screen">
    <header class="navbar bg-base-100 border-b border-base-300 px-4 sticky top-0 z-20">
      <div class="flex-none lg:hidden"><label for="nav-drawer" class="btn btn-ghost btn-square" aria-label="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label></div>
      <div class="flex-1 font-semibold px-2">Agenda</div>
      <div class="flex-none flex items-center gap-2">
        <span class="hidden sm:inline text-sm text-base-content/70">Léa Marchand</span>
        <button type="button" class="btn btn-ghost btn-square" data-theme-toggle aria-label="Basculer le thème clair/sombre"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <a href="index.html" class="btn btn-ghost btn-sm">Déconnexion</a>
      </div>
    </header>
    <main class="p-4 space-y-4">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <h1 class="text-xl font-semibold">Semaine du 12 au 17 octobre 2026</h1>
        <div class="flex flex-wrap items-center gap-3">
          <label class="flex items-center gap-2 text-sm">Praticien
            <select id="filter-pract" class="select select-sm"><option value="">Tous</option><option value="lea">Léa Marchand</option><option value="hugo">Hugo Bernard</option></select>
          </label>
          <a href="#" class="btn btn-primary btn-sm">Nouveau rendez-vous</a>
        </div>
      </div>
      <ul class="flex flex-wrap gap-2 text-xs" aria-label="Légende">
        <li class="badge badge-soft badge-primary">Réservé</li>
        <li class="badge badge-soft badge-success">Honoré</li>
        <li class="badge badge-soft badge-warning">Absent</li>
        <li class="badge badge-ghost">Annulé</li>
      </ul>
      <div class="card bg-base-100 border border-base-300 p-2"><div id="ec"></div></div>
    </main>
  </div>
  <div class="drawer-side z-30">
    <label for="nav-drawer" aria-label="Fermer le menu" class="drawer-overlay"></label>
    <aside class="bg-base-100 border-r border-base-300 min-h-full w-64">
      <div class="px-6 py-4 text-lg font-semibold text-primary">Doctolibre</div>
      <ul class="menu w-full px-3 gap-1">
        <li><a class="menu-active" href="agenda.html" aria-current="page">Agenda</a></li>
        <li><a href="#">Patients</a></li>
        <li><a href="#">Liste d'attente <span class="badge badge-sm badge-primary">3</span></a></li>
        <li><a href="#">Motifs</a></li>
        <li><a href="#">Disponibilités</a></li>
        <li><a href="#">Réglages</a></li>
      </ul>
    </aside>
  </div>
</div>

<dialog id="appt-dialog" class="modal modal-bottom sm:modal-middle" aria-labelledby="appt-title">
  <div class="modal-box">
    <h2 id="appt-title" class="text-lg font-semibold">Rendez-vous</h2>
    <div class="mt-1"><span id="appt-status" class="badge"></span></div>
    <dl class="mt-4 grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm">
      <dt class="text-base-content/70">Patient</dt><dd id="appt-patient" class="font-medium"></dd>
      <dt class="text-base-content/70">Motif</dt><dd id="appt-motif"></dd>
      <dt class="text-base-content/70">Horaire</dt><dd id="appt-time"></dd>
      <dt class="text-base-content/70">Praticien</dt><dd id="appt-pract"></dd>
    </dl>
    <div class="modal-action flex-wrap">
      <button type="button" class="btn btn-success btn-sm" data-set-status="done">Honoré</button>
      <button type="button" class="btn btn-warning btn-sm" data-set-status="noshow">Absent</button>
      <button type="button" class="btn btn-error btn-outline btn-sm" data-set-status="cancelled">Annuler</button>
      <form method="dialog"><button class="btn btn-ghost btn-sm">Fermer</button></form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Fermer">Fermer</button></form>
</dialog>
</body>
</html>
